# Supply chain (spec §7.7): weekly dependency updates, grouped to keep noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned in CLAUDE.md: typescript-eslint doesn't support TypeScript 7 yet, and
      # @cloudflare/vitest-plugin needs Vitest 4.1.x. Lift these when they do.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: "@vitest/*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
